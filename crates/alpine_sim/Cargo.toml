[package]
name = "alpine_sim"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rayon = "1.12.0"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

# The locked scenario tests (docs/scenario-tests.md). They print their own plain-language report.
# Run with: cargo test --release -p alpine_sim --test scenarios
[[test]]
name = "scenarios"
harness = false

# The locked step-2 tests: calendar, night and the skip-ahead (docs/scenario-tests.md, 12 to 20).
# Run with: cargo test --release -p alpine_sim --test step2
[[test]]
name = "step2"
harness = false

# The locked work-roster tests (docs/scenario-tests.md, 22 to 29).
# Run with: cargo test --release -p alpine_sim --test roster
[[test]]
name = "roster"
harness = false

# The locked carrying, cold and hunger tests (docs/scenario-tests.md, 30, 31 and 34 to 37).
# Run with: cargo test --release -p alpine_sim --test supply
[[test]]
name = "supply"
harness = false

# The locked falling-snow and rule-switch tests (docs/scenario-tests.md, 38 to 44).
# Run with: cargo test --release -p alpine_sim --test snow
[[test]]
name = "snow"
harness = false
