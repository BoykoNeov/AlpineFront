# Alpine Front tuning numbers.
#
# Plain values, safe to edit. The simulation and the scenario tests read them from here, so a change
# shows up in the next test report. The locked test expectations are in docs/scenario-tests.md.

[time]
# Simulation updates per game second.
ticks_per_second = 10
# Fastest game speed the player can choose. The speed pass measures the simulation at this speed.
max_speed = 64

[threads]
# Worker threads the simulation splits its work across.
simulation_threads = 8

[walking]
# Walking speed follows Tobler's hiking rule: on ground rising by `grade` (metres up per metre
# along), speed = peak_kmh * exp(-steepness * |grade + offset|). Fastest on a gentle downhill.
tobler_peak_kmh = 6.0
tobler_steepness = 3.5
tobler_offset = 0.05
# Soldiers carry kit, so they walk at this fraction of Tobler's unladen speed.
load_factor = 0.7
# Ground steeper than this cannot be walked on (climbing comes later).
steepest_walkable_deg = 45.0

[squad]
men_per_squad = 10
# Spacing between men when the squad has arrived and stands in formation.
formation_spacing_m = 2.5
# A man counts as arrived when this close to his place in the formation.
arrival_radius_m = 0.3
# How long a squad leader takes to work out a route after receiving an order. The route is
# computed in the background meanwhile; at 64x, 4 s gives it about 60 ms of real time (decision 30).
order_delay_s = 4.0

[soldier]
# Men try to keep at least this far from each other while moving.
personal_space_m = 1.0
# Height of a standing man's eyes, and of the point an observer must see to spot him (his head).
eye_height_m = 1.6
head_height_m = 1.6

[spotting]
# Clear weather, daylight, naked eye: a man further away than this is not spotted even in plain view.
spotting_range_m = 1500.0
# Each man looks around once per this many seconds (spread across ticks).
look_interval_s = 1.0

[line_of_sight]
# Earth curvature hides distant ground; air bends light back down by this fraction (standard value).
refraction_coefficient = 0.13
earth_radius_m = 6371000.0

[scenario]
# Step-1 scenario: Austro-Hungarian squads start near the summit, Italian squads on the slopes below.
austrian_squads = 15
italian_squads = 5
# Austrians start within this distance of the summit.
austrian_start_radius_m = 400.0
# Italians start, and patrol, between these distances from the summit on its southern side,
# below this height.
italian_zone_min_m = 1000.0
italian_zone_max_m = 2600.0
italian_zone_max_height_m = 2000.0
# An Italian squad waits this long (game minutes, chosen at random in the range) before moving on.
patrol_pause_min_minutes = 2.0
patrol_pause_max_minutes = 10.0
# Step-2 scenario: the same troops, on the calendar. The game opens at first light on this day
# (decisions 31 and 37). The week's cloud is in data/weather/march_1916.toml.
step2_first_day = "1916-03-06"

[light]
# Used only by scenarios with a calendar (step 2 on); step 1 always has daylight (decisions 33-35).
# How far a man in a dark coat is spotted against snow, by the light on the ground:
# [lux, metres]. Between the points the distance changes smoothly (straight lines on log-log
# paper). The top is capped by spotting_range_m above. The lux figures follow published tables;
# the distances are estimates, approved by the director on 2026-11-17.
#   100 lux and more: day, also overcast  10 lux: twilight just after sunset
#   1 lux: deep twilight   0.25: full moon   0.01: quarter moon
#   0.002: clear starlight only   0.0001: overcast, no moon
spotting_by_light = [[100.0, 1500.0], [10.0, 1000.0], [1.0, 500.0], [0.25, 300.0], [0.01, 120.0], [0.002, 50.0], [0.0001, 15.0]]
# Light from the sun under a clear sky by its height: [degrees above the horizon, lux], from high to
# low. Sunset about 400 lux; end of civil twilight (6 degrees down) about 3; nautical (12) 0.008;
# astronomical (18) 0.0006.
sun_lux_by_altitude = [[0.0, 400.0], [-6.0, 3.0], [-12.0, 0.008], [-18.0, 0.0006]]
# A full moon high in a clear sky; less when lower, and much less when not full.
full_moon_lux = 0.25
# Clear starlight and the night sky's own glow.
starlight_lux = 0.002
# A fully overcast sky lets this share of the light through.
overcast_light_factor = 0.05

[events]
# The skip-ahead stops, and normal play drops to 1x, when our men see an enemy squad nobody had
# seen for this long (decision 36).
new_contact_after_unseen_minutes = 30.0

[tiredness]
# The work roster (decisions 39 and 43). A man tires while awake and recovers while asleep in a
# shelter on rest duty. Only the player's men tire for now; the Italians follow scripted patrols.
# Hours awake that take a fresh man to exhausted.
hours_awake_to_exhausted = 18.0
# Hours asleep that take an exhausted man to fresh.
hours_asleep_to_fresh = 8.0
# An exhausted man spots at this share of the light's spotting distance and walks at this share of
# his speed; a less tired man in proportion (half as tired: three quarters of the distance).
exhausted_spotting_factor = 0.5
exhausted_walking_factor = 0.7
