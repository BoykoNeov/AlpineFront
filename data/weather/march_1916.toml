# Weather diary for Col di Lana, Monday 6 to Sunday 12 March 1916 (decision 34).
#
# INVENTED, not historical: no weather record from the summit for this week has been found. It is a
# plausible late-winter week with some clear nights and some overcast ones, so the night model has
# both to show. Safe to edit; replays keep a copy of the diary they were recorded with.
#
# Cloud cover: 0 = clear sky, 1 = overcast. Times are Central European Time. Between two entries the
# cover changes evenly; before the first and after the last it stays as it is. Keep changes spread
# over an hour or more, as real cloud is.
#
# Air temperature on the summit, in degrees Celsius (decision 51), INVENTED like the cloud: about
# -6 to -10 by day and -12 to -18 at night, coldest before dawn after a clear night, milder under
# overcast. Between two entries it changes evenly. Used by cold: men outside grow colder the lower
# it is.
#
# The falling snow piece of step 2 will add snowfall to this diary.

