# Lookout posts and shelters of the Austro-Hungarian summit position on Col di Lana, early 1916
# (decisions 40 and 43). Used by the step-2 work roster: guards go to posts, resting men to shelters.
#
# WHAT IS HISTORICAL AND WHAT IS NOT. Period accounts describe the position: about 200 m of trench in
# a half-circle around the two summit humps, facing the Italians, with forward posts of four or more
# men; behind the crest the great cavern, where about 100 men crowded, the large hut, and the
# Austrian counter-mine gallery, stopped at 25 m and made into a troop shelter. No source found gives
# the exact spots, so every x and y below was read from the terrain by Claude: posts where the view
# down the southern slopes is open, shelters where no point on the southern slopes can see them.
# The sources are listed in docs/decisions.md under decisions 40 and 43.
#
# Places are in metres from the summit (x east, y north). `squads` is how many squads the place
# holds; a squad standing guard at a post, or resting in a shelter, has a spot of its own there.
# Safe to edit; replays keep a copy of the file they were recorded with.

# ---- Lookout posts: on the half-circle of trench about 60 m out from the top -----------------------

